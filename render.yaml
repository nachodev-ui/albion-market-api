services:
  - type: web
    name: albion-market-api
    runtime: docker
    plan: free
    repo: https://github.com/nachodev-ui/albion-market-api
    branch: main
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /usr/local/bin/albion-market-api
    healthCheckPath: /readyz
    envVars:
      - key: APP_ENV
        value: production
      - key: HTTP_ADDR
        value: :8080
      - key: LOAD_DOTENV
        value: "false"
      - key: LOG_COLOR
        value: never
      - key: LOG_FORMAT
        value: json
      - key: CORS_ALLOWED_ORIGINS
        value: https://albioncalculator.app,https://www.albioncalculator.app,https://albion-production-calculator.pages.dev
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_EMERGENCY_DISABLED
        value: "false"
      - key: AUTH_ISSUER
        value: https://albion-production-calculator.us.auth0.com/
      - key: AUTH_AUDIENCE
        value: https://albion-market-api
      - key: AUTH_JWKS_CACHE_TTL
        value: 15m
      - key: AUTH_HTTP_TIMEOUT
        value: 5s
      - key: AUTH_CLOCK_SKEW
        value: 30s
      - key: BILLING_ENABLED
        value: "false"
      - key: BILLING_PROVIDER
        value: lemonsqueezy
      - key: BILLING_TEST_MODE
        value: "false"
      - key: BILLING_CHECKOUT_REDIRECT_URL
        value: https://albioncalculator.app/account?checkout=success
      - key: BILLING_GRACE_PERIOD
        value: 168h
      - key: BILLING_HTTP_TIMEOUT
        value: 10s
      - key: BILLING_MAX_WEBHOOK_BODY_BYTES
        value: "1048576"
      - key: BILLING_WEBHOOK_INGEST_TIMEOUT
        value: 1500ms
      - key: BILLING_WEBHOOK_WORKER_POLL_INTERVAL
        value: 250ms
      - key: BILLING_WEBHOOK_JOB_TIMEOUT
        value: 15s
      - key: BILLING_WEBHOOK_LEASE_DURATION
        value: 60s
      - key: BILLING_WEBHOOK_BASE_RETRY_DELAY
        value: 5s
      - key: BILLING_WEBHOOK_MAX_RETRY_DELAY
        value: 15m
      - key: BILLING_WEBHOOK_BATCH_SIZE
        value: "10"
      - key: BILLING_WEBHOOK_MAX_ATTEMPTS
        value: "8"
      - key: LEMONSQUEEZY_API_BASE_URL
        value: https://api.lemonsqueezy.com
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: LEMONSQUEEZY_PRO_VARIANT_ID
        sync: false
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: INGEST_BEARER_TOKEN_ID
        value: receiver-production-2026-07
      - key: INGEST_REQUIRE_HTTPS
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS_PER_SECOND
        value: "40"
      - key: RATE_LIMIT_BURST
        value: "80"
      - key: RATE_LIMIT_CLIENT_TTL
        value: 10m
      - key: DATABASE_URL
        sync: false
      - key: INGEST_BEARER_TOKEN
        sync: false
