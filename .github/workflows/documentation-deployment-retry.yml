name: Documentation deployment retry

on:
  workflow_run:
    workflows:
      - Documentation
    types:
      - completed
    branches:
      - main

permissions:
  actions: write
  contents: read

concurrency:
  group: documentation-deployment-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-pages-deployment:
    name: Retry transient Pages deployment failure
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Retry failed Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_TOTAL_ATTEMPTS: "3"
          POLL_INTERVAL_SECONDS: "10"
          POLL_TIMEOUT_SECONDS: "720"
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          refresh_state() {
            local jobs_json
            local run_json

            run_json="$(
              gh api \
                "repos/${REPOSITORY}/actions/runs/${RUN_ID}"
            )"

            run_attempt="$(jq -r '.run_attempt' <<< "${run_json}")"
            run_status="$(jq -r '.status' <<< "${run_json}")"
            run_conclusion="$(jq -r '.conclusion // empty' <<< "${run_json}")"

            jobs_json="$(
              gh api \
                "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100"
            )"

            build_conclusion="$(
              jq -r '
                [
                  .jobs[]
                  | select(.name == "Build documentation")
                ]
                | sort_by(.completed_at)
                | last
                | .conclusion // empty
              ' <<< "${jobs_json}"
            )"

            deploy_conclusion="$(
              jq -r '
                [
                  .jobs[]
                  | select(.name == "Deploy documentation")
                ]
                | sort_by(.completed_at)
                | last
                | .conclusion // empty
              ' <<< "${jobs_json}"
            )"
          }

          append_summary() {
            local message="$1"

            {
              echo "### Documentation deployment retry"
              echo
              echo "- Workflow run: ${RUN_ID}"
              echo "- Attempt: ${run_attempt}/${MAX_TOTAL_ATTEMPTS}"
              echo "- Workflow status: ${run_status}"
              echo "- Workflow conclusion: ${run_conclusion:-missing}"
              echo "- Build documentation: ${build_conclusion:-missing}"
              echo "- Deploy documentation: ${deploy_conclusion:-missing}"
              echo "- Result: ${message}"
              echo
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          wait_for_attempt() {
            local previous_attempt="$1"
            local deadline=$((SECONDS + POLL_TIMEOUT_SECONDS))

            while (( SECONDS < deadline )); do
              refresh_state

              if (( run_attempt > previous_attempt )) && \
                 [[ "${run_status}" == "completed" ]]; then
                return 0
              fi

              sleep "${POLL_INTERVAL_SECONDS}"
            done

            return 1
          }

          refresh_state

          if [[ "${build_conclusion}" != "success" || \
                "${deploy_conclusion}" != "failure" ]]; then
            append_summary "Not eligible for automatic retry"
            echo "This failure is not an isolated Pages deployment failure."
            exit 0
          fi

          while (( run_attempt < MAX_TOTAL_ATTEMPTS )); do
            previous_attempt="${run_attempt}"
            delay_seconds=$((previous_attempt * 30))

            echo "Waiting ${delay_seconds}s before retrying attempt $((previous_attempt + 1))."
            sleep "${delay_seconds}"

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"

            if ! wait_for_attempt "${previous_attempt}"; then
              refresh_state
              append_summary "Timed out waiting for the retried workflow"
              echo "::error::Timed out waiting for documentation workflow run ${RUN_ID}."
              exit 1
            fi

            if [[ "${deploy_conclusion}" == "success" ]]; then
              append_summary "Pages deployment recovered automatically"
              echo "Pages deployment succeeded on attempt ${run_attempt}."
              exit 0
            fi

            if [[ "${build_conclusion}" != "success" || \
                  "${deploy_conclusion}" != "failure" ]]; then
              append_summary "Retry stopped because the failure changed"
              echo "::error::The retried workflow no longer matches an isolated Pages deployment failure."
              exit 1
            fi
          done

          append_summary "Retry budget exhausted"
          echo "::error::GitHub Pages deployment failed after ${run_attempt} attempts."
          exit 1
