name: Patch admin OpenAPI contract

on:
  push:
    branches:
      - feat/secure-admin-panel
    paths:
      - .github/workflows/patch-admin-openapi.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/secure-admin-panel
          fetch-depth: 0
      - name: Insert admin contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('openapi/openapi.yaml')
          text = path.read_text(encoding='utf-8')
          if '  - name: Admin\n' not in text:
              text = text.replace(
                  '  - name: Billing\n    description: Checkout, portal de cliente y sincronización de suscripciones.\n',
                  '  - name: Billing\n    description: Checkout, portal de cliente y sincronización de suscripciones.\n'
                  '  - name: Admin\n    description: Administración autenticada y auditada de usuarios y acceso Pro.\n',
                  1,
              )

          marker = '  /api/v1/billing/checkout:\n'
          if '  /api/v1/admin/session:\n' not in text:
              block = '''  /api/v1/admin/session:
    get:
      tags: [Admin]
      operationId: getAdminSession
      security:
        - userBearer: []
      summary: Comprobar la autorización administrativa del usuario autenticado
      responses:
        '200':
          description: Sesión administrativa activa.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGet'

  /api/v1/admin/users:
    get:
      tags: [Admin]
      operationId: searchAdminUsers
      security:
        - userBearer: []
      summary: Buscar usuarios para administración
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Usuarios coincidentes y su acceso efectivo.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGet'

  /api/v1/admin/users/{userId}:
    get:
      tags: [Admin]
      operationId: getAdminUser
      security:
        - userBearer: []
      summary: Consultar el detalle administrativo de un usuario
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      responses:
        '200':
          description: Detalle de usuario, suscripciones y entitlements.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGet'

  /api/v1/admin/users/{userId}/grant-pro:
    post:
      tags: [Admin]
      operationId: grantAdminPro
      security:
        - userBearer: []
      summary: Conceder acceso Pro manual y auditado
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationDays, reason, confirmation]
              additionalProperties: false
              properties:
                durationDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                confirmation:
                  type: string
                  const: GRANT PRO
      responses:
        '200':
          description: Resultado idempotente del grant.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowedPost'

  /api/v1/admin/users/{userId}/revoke-pro:
    post:
      tags: [Admin]
      operationId: revokeAdminPro
      security:
        - userBearer: []
      summary: Retirar el grant Pro manual y registrar auditoría
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirmation]
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                confirmation:
                  type: string
                  const: REVOKE PRO
      responses:
        '200':
          description: Resultado idempotente de la revocación manual.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowedPost'

  /api/v1/admin/audit-events:
    get:
      tags: [Admin]
      operationId: listAdminAuditEvents
      security:
        - userBearer: []
      summary: Consultar el historial administrativo append-only
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Eventos administrativos más recientes.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGet'

'''
              text = text.replace(marker, block + marker, 1)

          parameter_marker = '  parameters:\n'
          if '    AdminUserId:\n' not in text:
              parameter = '''    AdminUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

'''
              text = text.replace(parameter_marker, parameter_marker + parameter, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add openapi/openapi.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: add secure admin OpenAPI contract'
          git push origin HEAD:feat/secure-admin-panel
