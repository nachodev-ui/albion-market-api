name: Container checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - .env.example
      - .gitignore
      - cmd/**
      - deploy/**
      - internal/**
      - migrations/**
      - scripts/initialize-deployment.ps1
      - scripts/test-container.ps1
      - scripts/test-deployment-compose.ps1
      - scripts/test-observability-compose.ps1
      - observability/**
      - go.mod
      - go.sum
      - .github/workflows/container.yml
      - .github/workflows/release.yml
      - .github/workflows/release-request.yml
      - .github/dependabot.yml
  push:
    branches:
      - develop
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - .env.example
      - .gitignore
      - cmd/**
      - deploy/**
      - internal/**
      - migrations/**
      - scripts/initialize-deployment.ps1
      - scripts/test-container.ps1
      - scripts/test-deployment-compose.ps1
      - scripts/test-observability-compose.ps1
      - observability/**
      - go.mod
      - go.sum
      - .github/workflows/container.yml
      - .github/workflows/release.yml
      - .github/workflows/release-request.yml
      - .github/dependabot.yml

permissions:
  contents: read

jobs:
  container:
    name: Reproducible deployment smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCAN_IMAGE: albion-market-api:ci-scan-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify deployment contracts
        run: go test ./internal/config ./internal/deployment

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Build production image for vulnerability scan
        run: docker build --tag "$SCAN_IMAGE" .

      - name: Scan production image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          scan-type: image
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: true
          pkg-types: os,library
          severity: CRITICAL,HIGH
          version: v0.72.0
          cache: true

      - name: Build and test secure Compose deployment
        shell: pwsh
        run: ./scripts/test-deployment-compose.ps1 -TimeoutSeconds 240

      - name: Test optional observability stack
        shell: pwsh
        run: ./scripts/test-observability-compose.ps1 -TimeoutSeconds 300
