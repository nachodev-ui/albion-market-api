name: Container checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - .env.example
      - .gitignore
      - cmd/**
      - deploy/**
      - render.yaml
      - internal/**
      - migrations/**
      - scripts/initialize-deployment.ps1
      - scripts/new-production-ingest-token.ps1
      - scripts/validate-render-config.py
      - scripts/test-container.ps1
      - scripts/test-deployment-compose.ps1
      - scripts/test-observability-compose.ps1
      - observability/**
      - go.mod
      - go.sum
      - .github/workflows/container.yml
      - .github/workflows/deploy-production.yml
      - .github/workflows/release.yml
      - .github/workflows/release-request.yml
      - .github/dependabot.yml
  push:
    branches:
      - develop
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - .env.example
      - .gitignore
      - cmd/**
      - deploy/**
      - render.yaml
      - internal/**
      - migrations/**
      - scripts/initialize-deployment.ps1
      - scripts/new-production-ingest-token.ps1
      - scripts/validate-render-config.py
      - scripts/test-container.ps1
      - scripts/test-deployment-compose.ps1
      - scripts/test-observability-compose.ps1
      - observability/**
      - go.mod
      - go.sum
      - .github/workflows/container.yml
      - .github/workflows/deploy-production.yml
      - .github/workflows/release.yml
      - .github/workflows/release-request.yml
      - .github/dependabot.yml

permissions:
  contents: read

jobs:
  container:
    name: Reproducible deployment smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCAN_IMAGE: albion-market-api:ci-scan-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate Render configuration contract
        run: python3 ./scripts/validate-render-config.py

      - name: Verify deployment contracts
        run: go test ./internal/config ./internal/deployment

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Resolve patched Go builder digest
        shell: bash
        run: |
          digest="$(docker buildx imagetools inspect golang:1.26.5-bookworm | awk '/^Digest:/ {print $2; exit}')"
          test -n "$digest"
          printf 'golang:1.26.5-bookworm@%s\n' "$digest" | tee go-builder-digest.txt

      - name: Upload Go builder digest
        uses: actions/upload-artifact@v4
        with:
          name: go-builder-digest-${{ github.run_id }}
          path: go-builder-digest.txt
          if-no-files-found: error
          retention-days: 1

      - name: Build production image for vulnerability scan
        run: |
          docker build \
            --build-arg "RENDER_GIT_COMMIT=${GITHUB_SHA}" \
            --tag "$SCAN_IMAGE" \
            .

      - name: Scan production image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          scan-type: image
          scanners: vuln
          format: json
          output: trivy-results.json
          exit-code: '0'
          ignore-unfixed: true
          pkg-types: os,library
          severity: CRITICAL,HIGH
          version: v0.72.0
          cache: true

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-${{ github.run_id }}
          path: trivy-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce vulnerability gate
        shell: bash
        run: |
          jq -r '
            .Results[]?
            | .Target as $target
            | .Vulnerabilities[]?
            | "\($target): \(.VulnerabilityID) | \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) | \(.Severity)"
          ' trivy-results.json

          if ! jq -e '[.Results[]?.Vulnerabilities[]?] | length == 0' trivy-results.json >/dev/null; then
            echo "The production image contains fixed HIGH or CRITICAL vulnerabilities."
            exit 1
          fi

      - name: Build and test secure Compose deployment
        shell: pwsh
        run: ./scripts/test-deployment-compose.ps1 -TimeoutSeconds 240

      - name: Test optional observability stack
        shell: pwsh
        run: ./scripts/test-observability-compose.ps1 -TimeoutSeconds 300
