name: Patch admin OpenAPI PR

on:
  push:
    branches:
      - feat/secure-admin-panel

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/secure-admin-panel
          fetch-depth: 0
      - name: Insert admin routes into OpenAPI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          exec(Path('scripts/patch-admin-openapi.py').read_text(encoding='utf-8'))
          PY
