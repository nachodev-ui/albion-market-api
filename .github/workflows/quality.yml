name: Quality checks

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    name: Go quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/account-entitlements-foundation
          fetch-depth: 0

      - name: Complete account foundation
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/account-entitlements-foundation'
        shell: bash
        run: |
          python3 scripts/complete_account_foundation.py
          gofmt -w internal/observability/readiness.go internal/observability/readiness_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add migrations/0008_account_integrity_constraints.sql \
              internal/observability/readiness.go \
              internal/observability/readiness_test.go \
              openapi/openapi.yaml
            git commit -m "chore: complete account foundation"
            git push origin HEAD:feat/account-entitlements-foundation
          fi

      - name: Reject committed secret files
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)secrets/|\.(token|secret)$' | grep -Ev '(^|/)\.env\.example$' || true)"
          if [[ -n "$forbidden" ]]; then
            printf 'Forbidden secret-bearing files are tracked:\n%s\n' "$forbidden"
            exit 1
          fi
          if git grep -nE -e '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----' -- . ':!*.md'; then
            echo 'A private key marker was found in tracked source files.'
            exit 1
          fi

      - name: Validate repository structure
        shell: bash
        run: |
          stray_docs="$(find . -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print)"
          if [[ -n "$stray_docs" ]]; then
            printf 'Long-form documentation must live under docs/:\n%s\n' "$stray_docs"
            exit 1
          fi

          invalid_migrations="$(find migrations -mindepth 1 -maxdepth 1 \
            \( ! -type f -o -type f ! -name '*.sql' \) -print 2>/dev/null || true)"
          if [[ -n "$invalid_migrations" ]]; then
            printf 'migrations/ may contain only SQL migration files:\n%s\n' "$invalid_migrations"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files that require gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build API
        run: go build -o /tmp/albion-market-api ./cmd/api
