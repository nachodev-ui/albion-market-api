name: Finalize player profile contract

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/albion-player-profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/albion-player-profile
          fetch-depth: 0
      - name: Apply route and OpenAPI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize_player_profile.py
          gofmt -w internal/handlers/playerprofile.go internal/server/router.go internal/deployment/player_profile_contract_test.go
          rm -f scripts/finalize_player_profile.py
          rm -f .github/workflows/diagnose-player-profile.yml
          rm -f .github/workflows/finalize-player-profile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: align player profile routes and OpenAPI'
          git push origin HEAD:feat/albion-player-profile
