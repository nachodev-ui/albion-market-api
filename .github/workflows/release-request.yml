name: Release request

on:
  create:

permissions:
  contents: read

concurrency:
  group: release-request-${{ github.event.ref }}
  cancel-in-progress: false

jobs:
  request:
    name: Create and dispatch stable release
    if: >-
      github.repository == 'nachodev-ui/albion-market-api' &&
      github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout release request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.ref }}
          fetch-depth: 0

      - name: Validate release request
        id: release
        env:
          REQUEST_REF: ${{ github.event.ref }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${REQUEST_REF#release/}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release request branches must match release/vMAJOR.MINOR.PATCH without leading zeroes: ${REQUEST_REF}" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          release_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [[ "${release_sha}" != "${main_sha}" ]]; then
            echo "Release request ${REQUEST_REF} must point to the current main commit ${main_sha}; got ${release_sha}." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists and must never be moved or reused." >&2
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "revision=${release_sha}"
            echo "request_ref=${REQUEST_REF}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create immutable annotated tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${RELEASE_SHA}" -m "release: ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Dispatch release workflow on tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -f ref="${TAG}"

      - name: Delete successful release request branch
        env:
          REQUEST_REF: ${{ steps.release.outputs.request_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "${REQUEST_REF}"

      - name: Publish request summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.revision }}
        shell: bash
        run: |
          {
            echo "### Release request accepted"
            echo
            echo "- Tag: \`${TAG}\`"
            echo "- Revision: \`${RELEASE_SHA}\`"
            echo "- Workflow: \`release.yml\` dispatched on the immutable tag"
          } >> "${GITHUB_STEP_SUMMARY}"
