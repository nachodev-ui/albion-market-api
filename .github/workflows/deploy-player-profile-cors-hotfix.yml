name: Deploy player profile CORS hotfix

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  deploy:
    if: github.head_ref == 'ops/deploy-player-profile-cors-hotfix'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official production deployment
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: 54544fb1ad2c706415ebffa7f86a2f93f12eeefd
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"main","inputs":{"confirm":"DEPLOY"}}' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/dispatches"

          run_id=''
          for attempt in $(seq 1 30); do
            runs="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            run_id="$(jq -r --arg sha "${TARGET_SHA}" --arg started "${started_at}" \
              '.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started) | .id' <<< "${runs}" | head -n 1)"
            if [[ -n "${run_id}" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "${run_id}" ]]; then
            echo 'Official deployment run was not found.' >&2
            exit 1
          fi
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for official deployment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            run="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
            status="$(jq -r '.status' <<< "${run}")"
            conclusion="$(jq -r '.conclusion // empty' <<< "${run}")"
            if [[ "${status}" == 'completed' ]]; then
              [[ "${conclusion}" == 'success' ]]
              exit
            fi
            sleep 10
          done
          echo 'Timed out waiting for official deployment.' >&2
          exit 1

      - name: Verify production PUT preflight
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --dump-header "${headers}" \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://albion-production-calculator.pages.dev' \
            --header 'Access-Control-Request-Method: PUT' \
            --header 'Access-Control-Request-Headers: authorization,content-type' \
            'https://albion-market-api.onrender.com/api/v1/me/albion-profile/link')"
          [[ "${status}" == '204' ]]
          tr -d '\r' < "${headers}" | grep -Fqi 'Access-Control-Allow-Origin: https://albion-production-calculator.pages.dev'
          tr -d '\r' < "${headers}" | grep -Fqi 'Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS'
