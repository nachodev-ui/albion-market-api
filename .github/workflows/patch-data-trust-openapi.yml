name: Align data trust OpenAPI

on:
  push:
    branches:
      - feat/data-trust-center

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/data-trust-center
          fetch-depth: 0
      - name: Add trust properties to CurrentPrice
        shell: python
        run: |
          from pathlib import Path

          path = Path('openapi/openapi.yaml')
          source = path.read_text(encoding='utf-8')
          old = """        - buyPriceMaxDate
        - updatedAt
      properties:
"""
          new = """        - buyPriceMaxDate
        - updatedAt
        - historyObservations7d
        - historyVolume7d
        - medianPrice7d
      properties:
"""
          if old not in source:
              raise SystemExit('CurrentPrice required block not found')
          source = source.replace(old, new, 1)
          old = """        updatedAt:
          type: string
          format: date-time
    PriceQueryResponse:
"""
          new = """        updatedAt:
          type: string
          format: date-time
        historyObservations7d:
          type: integer
          format: int64
          minimum: 0
        historyVolume7d:
          type: integer
          format: int64
          minimum: 0
        medianPrice7d:
          type: [integer, 'null']
          format: int64
          minimum: 0
    PriceQueryResponse:
"""
          if old not in source:
              raise SystemExit('CurrentPrice properties block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
      - name: Commit contract update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openapi/openapi.yaml
          git commit -m 'docs: document current price trust fields'
          git push origin HEAD:feat/data-trust-center
