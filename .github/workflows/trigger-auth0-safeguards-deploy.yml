name: Trigger Auth0 safeguards deployment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-auth0-safeguards-deploy.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch official Render deployment
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy production to Render
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"main","inputs":{"confirm":"DEPLOY"}}' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/dispatches"
