name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Publish signed release
    if: github.repository == 'nachodev-ui/albion-market-api' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate SemVer tag and main provenance
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH without leading zeroes: ${tag}" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          release_sha="$(git rev-list -n 1 "${tag}")"
          main_sha="$(git rev-parse origin/main)"
          if [[ "${release_sha}" != "${main_sha}" ]]; then
            echo "Release tag ${tag} must point to the current main commit ${main_sha}; got ${release_sha}." >&2
            exit 1
          fi

          version="${tag#v}"
          created="$(git show -s --format=%cI "${release_sha}")"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "revision=${release_sha}"
            echo "created=${created}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            REVISION=${{ steps.release.outputs.revision }}
            CREATED=${{ steps.release.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare release evidence directory
        shell: bash
        run: mkdir -p dist

      - name: Generate downloadable SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          artifact-name: albion-market-api-${{ steps.release.outputs.version }}.spdx.json
          output-file: dist/albion-market-api-${{ steps.release.outputs.version }}.spdx.json
          format: spdx-json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign image with keyless OIDC identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Verify image signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_NAME}@${DIGEST}"

      - name: Generate signed provenance attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate signed SBOM attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: dist/albion-market-api-${{ steps.release.outputs.version }}.spdx.json
          push-to-registry: true

      - name: Create release evidence
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > dist/release-metadata.json <<EOF_METADATA
          {
            "tag": "${GITHUB_REF_NAME}",
            "version": "${{ steps.release.outputs.version }}",
            "revision": "${{ steps.release.outputs.revision }}",
            "image": "${IMAGE_NAME}",
            "digest": "${DIGEST}",
            "created": "${{ steps.release.outputs.created }}"
          }
          EOF_METADATA
          (
            cd dist
            sha256sum \
              "albion-market-api-${{ steps.release.outputs.version }}.spdx.json" \
              release-metadata.json > SHA256SUMS
          )

      - name: Preserve release evidence as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --verify-tag \
            --title "Albion Market API ${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest

      - name: Publish release summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            echo "### Release ${GITHUB_REF_NAME}"
            echo
            echo "- Image: \`${IMAGE_NAME}@${DIGEST}\`"
            echo "- SBOM: \`albion-market-api-${{ steps.release.outputs.version }}.spdx.json\`"
            echo "- Signature: Cosign keyless OIDC"
            echo "- Attestations: provenance and SBOM"
          } >> "${GITHUB_STEP_SUMMARY}"
