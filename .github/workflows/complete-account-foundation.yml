name: Complete account foundation

on:
  push:
    branches:
      - feat/account-entitlements-foundation

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'chore: complete account foundation') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/account-entitlements-foundation
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply account foundation completion patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("migrations/0008_account_integrity_constraints.sql").write_text("""alter table billing_webhook_events
              drop constraint if exists billing_webhook_events_status_check;

          alter table subscriptions
              drop constraint if exists subscriptions_status_check;

          alter table app_users
              add constraint app_users_auth_subject_length
              check (length(auth_subject) between 3 and 255),
              add constraint app_users_display_name_length
              check (display_name is null or length(display_name) <= 160),
              add constraint app_users_email_length
              check (email is null or length(email) <= 320);

          alter table billing_webhook_events
              add constraint billing_webhook_events_error_length
              check (error_message is null or length(error_message) <= 2000),
              add constraint billing_webhook_events_event_id_length
              check (length(provider_event_id) between 1 and 255),
              add constraint billing_webhook_events_provider_length
              check (length(provider) between 1 and 40),
              add constraint billing_webhook_events_status_allowed
              check (status in ('pending', 'processed', 'failed', 'ignored')),
              add constraint billing_webhook_events_type_length
              check (length(event_type) between 1 and 160);

          alter table plan_entitlements
              add constraint plan_entitlements_key_format
              check (entitlement_key ~ '^[a-z][a-z0-9_.]{2,127}$');

          alter table plans
              add constraint plans_display_name_length
              check (length(display_name) between 1 and 80);

          alter table subscriptions
              add constraint subscriptions_period_order
              check (
                  current_period_start is null
                  or current_period_end is null
                  or current_period_end >= current_period_start
              ),
              add constraint subscriptions_provider_length
              check (length(provider) between 1 and 40),
              add constraint subscriptions_status_allowed
              check (status in ('trialing', 'active', 'past_due', 'canceled', 'expired'));

          alter table user_entitlement_overrides
              add constraint user_entitlement_overrides_key_format
              check (entitlement_key ~ '^[a-z][a-z0-9_.]{2,127}$'),
              add constraint user_entitlement_overrides_reason_length
              check (reason is null or length(reason) <= 500);

          update app_schema_state
          set version = greatest(version, 8), updated_at = now()
          where singleton = true;
          """, encoding="utf-8")

          replace_once(
              "internal/observability/readiness.go",
              "const ExpectedSchemaVersion = 6",
              "const ExpectedSchemaVersion = 8",
          )
          replace_once(
              "internal/observability/readiness.go",
              'var requiredReadinessRelations = []string{\n\t"public.app_schema_state",\n',
              'var requiredReadinessRelations = []string{\n\t"public.app_schema_state",\n\t"public.app_users",\n\t"public.billing_webhook_events",\n\t"public.plan_entitlements",\n\t"public.plans",\n\t"public.subscriptions",\n\t"public.user_entitlement_overrides",\n',
          )
          replace_once(
              "internal/observability/readiness_test.go",
              "if ExpectedSchemaVersion != 6 {\n\t\tt.Fatalf(\"ExpectedSchemaVersion = %d, want 6\", ExpectedSchemaVersion)\n\t}",
              "if ExpectedSchemaVersion != 8 {\n\t\tt.Fatalf(\"ExpectedSchemaVersion = %d, want 8\", ExpectedSchemaVersion)\n\t}",
          )

          replace_once(
              "openapi/openapi.yaml",
              "  - name: Ingest\n    description: Ingesta interna autenticada e idempotente.\npaths:\n",
              "  - name: Ingest\n    description: Ingesta interna autenticada e idempotente.\n  - name: Accounts\n    description: Perfil autenticado, suscripción y entitlements efectivos.\npaths:\n",
          )

          account_paths = """  /api/v1/me:
            get:
              tags: [Accounts]
              operationId: getCurrentAccount
              security:
                - userBearer: []
              summary: Consultar el perfil y acceso efectivo del usuario autenticado
              description: Sincroniza el usuario identificado por el claim `sub` y devuelve su plan y entitlements efectivos.
              responses:
                '200':
                  description: Perfil, suscripción efectiva y entitlements resueltos.
                  headers:
                    Cache-Control:
                      $ref: '#/components/headers/NoStore'
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/AccountAccess'
                '401':
                  description: Access token ausente, mal formado, inválido o expirado.
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/ErrorResponse'
                '403':
                  $ref: '#/components/responses/OriginNotAllowed'
                '405':
                  $ref: '#/components/responses/MethodNotAllowedGet'
                '429':
                  $ref: '#/components/responses/RateLimited'
                '500':
                  $ref: '#/components/responses/InternalServerError'
                '503':
                  description: La autenticación de usuarios todavía no está habilitada en el runtime.
                  headers:
                    Cache-Control:
                      $ref: '#/components/headers/NoStore'
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/ErrorResponse'
                      example:
                        error: authentication unavailable

          /api/v1/me/entitlements:
            get:
              tags: [Accounts]
              operationId: getCurrentEntitlements
              security:
                - userBearer: []
              summary: Consultar la suscripción y los entitlements efectivos
              responses:
                '200':
                  description: Suscripción efectiva y mapa de entitlements del usuario.
                  headers:
                    Cache-Control:
                      $ref: '#/components/headers/NoStore'
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/AccountEntitlementsResponse'
                '401':
                  description: Access token ausente, mal formado, inválido o expirado.
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/ErrorResponse'
                '403':
                  $ref: '#/components/responses/OriginNotAllowed'
                '405':
                  $ref: '#/components/responses/MethodNotAllowedGet'
                '429':
                  $ref: '#/components/responses/RateLimited'
                '500':
                  $ref: '#/components/responses/InternalServerError'
                '503':
                  description: La autenticación de usuarios todavía no está habilitada en el runtime.
                  headers:
                    Cache-Control:
                      $ref: '#/components/headers/NoStore'
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/ErrorResponse'
                      example:
                        error: authentication unavailable

          """
          replace_once(
              "openapi/openapi.yaml",
              "  /api/v1/status:\n",
              account_paths + "  /api/v1/status:\n",
          )

          replace_once(
              "openapi/openapi.yaml",
              "    ingestBearer:\n      type: http\n      scheme: bearer\n      bearerFormat: opaque\n      description: Token interno configurado para el receiver/forwarder.\n",
              "    ingestBearer:\n      type: http\n      scheme: bearer\n      bearerFormat: opaque\n      description: Token interno configurado para el receiver/forwarder.\n    userBearer:\n      type: http\n      scheme: bearer\n      bearerFormat: JWT\n      description: Access token Auth0 firmado con RS256 y validado mediante JWKS.\n",
          )

          account_schemas = """    AccountUser:
            type: object
            required: [id, email, displayName, createdAt, updatedAt, lastLoginAt]
            properties:
              id:
                type: string
                format: uuid
              email:
                type: [string, 'null']
                format: email
              displayName:
                type: [string, 'null']
                maxLength: 160
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
              lastLoginAt:
                type: [string, 'null']
                format: date-time
          AccountSubscription:
            type: object
            required: [plan, status, accessUntil]
            properties:
              plan:
                type: string
                enum: [free, pro, guild]
              status:
                type: string
                enum: [none, trialing, active, past_due, canceled, expired]
              accessUntil:
                type: [string, 'null']
                format: date-time
          EntitlementMap:
            type: object
            additionalProperties: true
            examples:
              - history.max_days: 28
                optimizer.liquidity: true
                exports.csv: true
          AccountAccess:
            type: object
            required: [user, subscription, entitlements]
            properties:
              user:
                $ref: '#/components/schemas/AccountUser'
              subscription:
                $ref: '#/components/schemas/AccountSubscription'
              entitlements:
                $ref: '#/components/schemas/EntitlementMap'
          AccountEntitlementsResponse:
            type: object
            required: [subscription, entitlements]
            properties:
              subscription:
                $ref: '#/components/schemas/AccountSubscription'
              entitlements:
                $ref: '#/components/schemas/EntitlementMap'
          """
          replace_once(
              "openapi/openapi.yaml",
              "  schemas:\n    Server:\n",
              "  schemas:\n" + account_schemas + "    Server:\n",
          )
          PY

      - name: Format and test
        shell: bash
        run: |
          gofmt -w internal/observability/readiness.go internal/observability/readiness_test.go
          go test ./...
          go vet ./...

      - name: Commit completed foundation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/0008_account_integrity_constraints.sql \
            internal/observability/readiness.go \
            internal/observability/readiness_test.go \
            openapi/openapi.yaml
          git commit -m "chore: complete account foundation"
          git push origin HEAD:feat/account-entitlements-foundation
