name: Apply Albion player profile implementation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/albion-player-profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/albion-player-profile
          fetch-depth: 0
      - name: Apply reviewed implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '