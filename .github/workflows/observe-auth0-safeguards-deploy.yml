name: Observe Auth0 safeguards deployment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/observe-auth0-safeguards-deploy.yml

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  observe:
    name: Observe official Render deployment
    runs-on: ubuntu-latest
    steps:
      - name: Wait for latest official deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          workflow_endpoint="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/runs?event=workflow_dispatch&per_page=1"
          run_id=''
          target_sha=''
          target_url=''
          conclusion=''

          for attempt in $(seq 1 90); do
            response="$(curl \
              --fail \
              --silent \
              --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${workflow_endpoint}")"

            run_id="$(jq -r '.workflow_runs[0].id // empty' <<< "${response}")"
            target_sha="$(jq -r '.workflow_runs[0].head_sha // empty' <<< "${response}")"
            target_url="$(jq -r '.workflow_runs[0].html_url // empty' <<< "${response}")"
            status="$(jq -r '.workflow_runs[0].status // empty' <<< "${response}")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<< "${response}")"

            if [[ -z "${run_id}" || -z "${target_sha}" ]]; then
              echo "Attempt ${attempt}/90: official deployment run not visible yet."
              sleep 10
              continue
            fi

            echo "Official deployment run ${run_id}: status=${status} conclusion=${conclusion:-pending}."
            if [[ "${status}" == 'completed' ]]; then
              break
            fi
            sleep 10
          done

          if [[ -z "${run_id}" || -z "${target_sha}" || -z "${conclusion}" ]]; then
            echo 'Official deployment did not complete before the observer timeout.' >&2
            exit 1
          fi

          state='failure'
          description='Render production deployment failed'
          if [[ "${conclusion}" == 'success' ]]; then
            state='success'
            description='Render production deployment passed'
          fi

          payload="$(jq -n \
            --arg state "${state}" \
            --arg context 'deploy/render-production' \
            --arg description "${description}" \
            --arg target_url "${target_url}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "${payload}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${target_sha}" \
            >/dev/null

          [[ "${conclusion}" == 'success' ]]
