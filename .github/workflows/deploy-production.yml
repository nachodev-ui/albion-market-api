name: Deploy production to Render

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Escribe DEPLOY para ejecutar migraciones y desplegar main
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: production-render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate Neon and deploy API to Render
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      API_URL: https://albion-market-api.onrender.com
      FRONTEND_ORIGIN: https://albioncalculator.app
      MIGRATION_IMAGE: albion-market-api:production-migration-${{ github.sha }}
      EXPECTED_AUTH_ENABLED: 'true'
      EXPECTED_AUTH_ISSUER: https://albion-production-calculator.us.auth0.com/
      EXPECTED_AUTH_AUDIENCE: https://albion-market-api

    steps:
      - name: Checkout production revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Render repository contract
        run: python3 ./scripts/validate-render-config.py

      - name: Validate Auth0 production configuration
        run: python3 ./scripts/validate-auth0-production.py

      - name: Derive immutable build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          version="$(git rev-parse --short=12 HEAD)"
          created="$(git show -s --format=%cI HEAD)"
          remote_revision="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "${remote_revision}" != "${revision}" ]]; then
            echo "main moved from ${revision} to ${remote_revision}; refusing an ambiguous deployment." >&2
            exit 1
          fi
          {
            echo "revision=${revision}"
            echo "version=${version}"
            echo "created=${created}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build the exact migration image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg "VERSION=${{ steps.metadata.outputs.version }}" \
            --build-arg "REVISION=${{ steps.metadata.outputs.revision }}" \
            --build-arg "CREATED=${{ steps.metadata.outputs.created }}" \
            --tag "${MIGRATION_IMAGE}" \
            .

      - name: Apply and validate Neon migrations before deploy
        env:
          NEON_MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NEON_MIGRATION_DATABASE_URL}" ]]; then
            echo "NEON_MIGRATION_DATABASE_URL is required in the production Environment." >&2
            exit 1
          fi
          docker run --rm \
            --env "DATABASE_URL=${NEON_MIGRATION_DATABASE_URL}" \
            "${MIGRATION_IMAGE}" \
            /usr/local/bin/migrate

      - name: Trigger latest linked main commit on Render
        id: render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL}" ]]; then
            echo "RENDER_DEPLOY_HOOK_URL is required in the production Environment." >&2
            exit 1
          fi

          response_file="$(mktemp)"
          http_status="$(curl \
            --silent \
            --show-error \
            --request POST \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            "${RENDER_DEPLOY_HOOK_URL}")"

          if [[ "${http_status}" != '200' && "${http_status}" != '202' ]]; then
            echo "Render deploy hook returned HTTP ${http_status}." >&2
            jq -c '{id: (.id // .deploy.id // null), status: (.status // .deploy.status // null)}' "${response_file}" 2>/dev/null || true
            exit 1
          fi

          jq -e . "${response_file}" > /dev/null
          deploy_id="$(jq -r '.id // .deploy.id // empty' "${response_file}")"
          deploy_status="$(jq -r '.status // .deploy.status // empty' "${response_file}")"
          {
            echo "http_status=${http_status}"
            echo "deploy_id=${deploy_id}"
            echo "deploy_status=${deploy_status}"
          } >> "${GITHUB_OUTPUT}"

          echo "Render accepted latest-main deployment: HTTP ${http_status}, deploy_id=${deploy_id:-queued}, status=${deploy_status:-queued}."

      - name: Wait for Render to serve the exact revision
        shell: bash
        run: |
          set -euo pipefail
          expected_revision="${{ steps.metadata.outputs.revision }}"
          for attempt in $(seq 1 180); do
            metrics="$(curl --fail --silent --show-error --max-time 10 "${API_URL}/metrics" 2>/dev/null || true)"
            if grep -Eq "albion_market_api_build_info\\{[^}]*revision=\"${expected_revision}\"" <<< "${metrics}"; then
              echo "Render is serving revision ${expected_revision}."
              exit 0
            fi
            if (( attempt == 1 || attempt % 15 == 0 )); then
              current_build="$(grep -E '^albion_market_api_build_info\{' <<< "${metrics}" | head -n 1 || true)"
              echo "Attempt ${attempt}/180: expected=${expected_revision}; current=${current_build:-unavailable}; hook_http=${{ steps.render.outputs.http_status }}; deploy_id=${{ steps.render.outputs.deploy_id }}."
            fi
            sleep 10
          done
          echo "Render did not serve revision ${expected_revision} before the timeout. Hook HTTP=${{ steps.render.outputs.http_status }}, deploy_id=${{ steps.render.outputs.deploy_id }}." >&2
          exit 1

      - name: Verify liveness and readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "${API_URL}/healthz" | jq -e .
          curl --fail --show-error --silent "${API_URL}/readyz" | jq -e '.status == "ok"'

      - name: Verify account authentication mode
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl \
            --silent \
            --show-error \
            --output account-auth-response.json \
            --write-out '%{http_code}' \
            "${API_URL}/api/v1/me")"

          if [[ "${EXPECTED_AUTH_ENABLED}" == 'true' ]]; then
            if [[ "${status}" != '401' ]]; then
              echo "Expected 401 from /api/v1/me with Auth0 enabled, got ${status}." >&2
              cat account-auth-response.json >&2
              exit 1
            fi
            jq -e '.error == "unauthorized"' account-auth-response.json > /dev/null
            echo 'Auth0 account routes are enabled and reject missing bearer tokens.'
          else
            if [[ "${status}" != '503' ]]; then
              echo "Expected 503 from /api/v1/me with Auth0 disabled, got ${status}." >&2
              cat account-auth-response.json >&2
              exit 1
            fi
            jq -e '.error == "authentication unavailable"' account-auth-response.json > /dev/null
            echo 'Auth0 account routes remain disabled.'
          fi

      - name: Validate Cloudflare CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$({ curl \
            --silent \
            --show-error \
            --output /dev/null \
            --dump-header "${headers}" \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header "Origin: ${FRONTEND_ORIGIN}" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            "${API_URL}/api/v1/prices/query"; } | tr -d '\r')"
          if [[ "${status}" != "200" && "${status}" != "204" ]]; then
            echo "Unexpected CORS preflight status: ${status}" >&2
            cat "${headers}" >&2
            exit 1
          fi
          tr -d '\r' < "${headers}" | grep -Fqi "Access-Control-Allow-Origin: ${FRONTEND_ORIGIN}"

      - name: Verify ingest authentication without inserting data
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl \
            --silent \
            --show-error \
            --output ingest-auth-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Authorization: Bearer deployment-probe-invalid-token' \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${API_URL}/api/v1/ingest/prices")"
          if [[ "${status}" != "401" ]]; then
            echo "Expected 401 from invalid ingest credential, got ${status}." >&2
            cat ingest-auth-response.json >&2
            exit 1
          fi
          jq -e '.error == "unauthorized"' ingest-auth-response.json > /dev/null

      - name: Verify public prices and history
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --show-error \
            --silent \
            --get \
            --data-urlencode 'server=west' \
            --data-urlencode 'marketKey=martlock' \
            --data-urlencode 'itemIds=T4_BAG' \
            --data-urlencode 'quality=1' \
            "${API_URL}/api/v1/prices" \
            | jq -e . > /dev/null

          curl \
            --fail \
            --show-error \
            --silent \
            --get \
            --data-urlencode 'server=west' \
            --data-urlencode 'marketKey=martlock' \
            --data-urlencode 'itemId=T4_BAG' \
            --data-urlencode 'quality=1' \
            --data-urlencode 'period=4-weeks' \
            "${API_URL}/api/v1/history" \
            | jq -e . > /dev/null

      - name: Verify Cloudflare frontend availability
        run: curl --fail --show-error --silent "${FRONTEND_ORIGIN}" > /dev/null

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "### Render production deployment"
            echo
            echo "- Version: \`${{ steps.metadata.outputs.version }}\`"
            echo "- Revision: \`${{ steps.metadata.outputs.revision }}\`"
            echo "- Created: \`${{ steps.metadata.outputs.created }}\`"
            echo "- Render hook HTTP: \`${{ steps.render.outputs.http_status }}\`"
            echo "- Render deploy ID: \`${{ steps.render.outputs.deploy_id }}\`"
            echo "- Neon migrations: completed before deploy"
            echo "- Render health/readiness: verified"
            echo "- Account authentication mode: ${EXPECTED_AUTH_ENABLED}"
            echo "- Canonical frontend CORS and availability: verified"
            echo "- Public prices/history: verified"
            echo "- Ingest authentication probe: rejected without writes"
          } >> "${GITHUB_STEP_SUMMARY}"
