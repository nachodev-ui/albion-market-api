name: Billing format diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  billing-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Synchronize generated formatting and API contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("openapi/openapi.yaml")
          text = path.read_text(encoding="utf-8")

          account_tag = """  - name: Accounts
              description: Perfil autenticado, suscripción y entitlements efectivos.
          """
          billing_tag = account_tag + """  - name: Billing
              description: Checkout, portal de cliente y sincronización de suscripciones.
          """
          if "  - name: Billing\n" not in text:
              if account_tag not in text:
                  raise SystemExit("Accounts tag marker not found")
              text = text.replace(account_tag, billing_tag, 1)

          billing_paths = r'''  /api/v1/billing/checkout:
              post:
                tags: [Billing]
                operationId: createBillingCheckout
                security:
                  - userBearer: []
                summary: Crear un checkout alojado para contratar Pro
                description: Requiere el scope `read:account` y vincula el checkout con el usuario autenticado.
                responses:
                  '201':
                    description: Checkout sandbox creado.
                    headers:
                      Cache-Control:
                        $ref: '#/components/headers/NoStore'
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/BillingURLResponse'
                  '401':
                    description: Access token ausente, inválido o expirado.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'
                  '403':
                    description: Origen no permitido o token sin el scope requerido.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'
                  '405':
                    $ref: '#/components/responses/MethodNotAllowedPost'
                  '409':
                    description: El usuario ya posee una suscripción administrada por el proveedor.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'
                  '429':
                    $ref: '#/components/responses/RateLimited'
                  '500':
                    $ref: '#/components/responses/InternalServerError'
                  '502':
                    description: El proveedor de facturación no respondió correctamente.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'
                  '503':
                    description: La facturación todavía no está habilitada en el runtime.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'

            /api/v1/billing/portal:
              post:
                tags: [Billing]
                operationId: createBillingPortal
                security:
                  - userBearer: []
                summary: Obtener una URL vigente del portal de cliente
                description: Requiere el scope `read:account` y una suscripción asociada al usuario.
                responses:
                  '200':
                    description: URL firmada del portal de cliente.
                    headers:
                      Cache-Control:
                        $ref: '#/components/headers/NoStore'
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/BillingURLResponse'
                  '401':
                    description: Access token ausente, inválido o expirado.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'
                  '403':
                    description: Origen no permitido o token sin el scope requerido.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'
                  '404':
                    description: El usuario no tiene una suscripción del proveedor.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'
                  '405':
                    $ref: '#/components/responses/MethodNotAllowedPost'
                  '429':
                    $ref: '#/components/responses/RateLimited'
                  '500':
                    $ref: '#/components/responses/InternalServerError'
                  '502':
                    description: El proveedor de facturación no respondió correctamente.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'
                  '503':
                    description: La facturación todavía no está habilitada en el runtime.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'

            /api/v1/webhooks/lemonsqueezy:
              post:
                tags: [Billing]
                operationId: processLemonSqueezyWebhook
                security: []
                summary: Procesar un evento firmado de Lemon Squeezy
                description: Valida `X-Signature`, deduplica el payload y sincroniza el acceso efectivo.
                responses:
                  '200':
                    description: Evento procesado, ignorado o reconocido como duplicado.
                    headers:
                      Cache-Control:
                        $ref: '#/components/headers/NoStore'
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/BillingWebhookResponse'
                  '400':
                    $ref: '#/components/responses/BadRequest'
                  '401':
                    description: Firma HMAC ausente o inválida.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'
                  '405':
                    $ref: '#/components/responses/MethodNotAllowedPost'
                  '413':
                    $ref: '#/components/responses/PayloadTooLarge'
                  '429':
                    $ref: '#/components/responses/RateLimited'
                  '500':
                    description: El evento no pudo persistirse o sincronizarse.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'
                  '503':
                    description: La facturación todavía no está habilitada en el runtime.
                    content:
                      application/json:
                        schema:
                          $ref: '#/components/schemas/ErrorResponse'

          '''
          if "  /api/v1/billing/checkout:\n" not in text:
              marker = "  /api/v1/status:\n"
              if marker not in text:
                  raise SystemExit("Status route marker not found")
              text = text.replace(marker, billing_paths + marker, 1)

          billing_schemas = r'''    BillingURLResponse:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
            BillingWebhookResponse:
              type: object
              additionalProperties: false
              required: [status, duplicate]
              properties:
                status:
                  type: string
                  enum: [processed, ignored]
                duplicate:
                  type: boolean
          '''
          if "    BillingURLResponse:\n" not in text:
              marker = "    Server:\n"
              if marker not in text:
                  raise SystemExit("Server schema marker not found")
              text = text.replace(marker, billing_schemas + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

          gofmt -w .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.go' openapi/openapi.yaml
            git commit -m "docs: synchronize billing API contract"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Capture contract diagnostics
        run: go test ./internal/contracts -run TestOpenAPI -count=1 > contracts.log 2>&1 || true
      - name: Capture Go test diagnostics
        run: go test ./... > go-test.log 2>&1 || true
      - name: Upload diagnostic bundle
        uses: actions/upload-artifact@v4
        with:
          name: billing-diagnostics
          path: |
            contracts.log
            go-test.log
          if-no-files-found: error
          retention-days: 1
