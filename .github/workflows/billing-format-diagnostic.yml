name: Billing format diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  billing-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Repair generated billing schemas
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("openapi/openapi.yaml")
          text = path.read_text(encoding="utf-8")
          malformed = (
              "    BillingURLResponse:\n"
              "    type: object\n"
              "    additionalProperties: false\n"
              "    required: [url]\n"
              "    properties:\n"
              "      url:\n"
              "        type: string\n"
              "        format: uri\n"
              "  BillingWebhookResponse:\n"
              "    type: object\n"
              "    additionalProperties: false\n"
              "    required: [status, duplicate]\n"
              "    properties:\n"
              "      status:\n"
              "        type: string\n"
              "        enum: [processed, ignored]\n"
              "      duplicate:\n"
              "        type: boolean\n"
          )
          corrected = (
              "    BillingURLResponse:\n"
              "      type: object\n"
              "      additionalProperties: false\n"
              "      required: [url]\n"
              "      properties:\n"
              "        url:\n"
              "          type: string\n"
              "          format: uri\n"
              "    BillingWebhookResponse:\n"
              "      type: object\n"
              "      additionalProperties: false\n"
              "      required: [status, duplicate]\n"
              "      properties:\n"
              "        status:\n"
              "          type: string\n"
              "          enum: [processed, ignored]\n"
              "        duplicate:\n"
              "          type: boolean\n"
          )
          if malformed not in text:
              raise SystemExit("Malformed billing schema block not found")
          path.write_text(text.replace(malformed, corrected, 1), encoding="utf-8")
          PY

          gofmt -w .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go' openapi/openapi.yaml
          git commit -m "docs: repair billing response schemas"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Capture contract diagnostics
        run: go test ./internal/contracts -run TestOpenAPI -count=1 > contracts.log 2>&1 || true
      - name: Capture Go test diagnostics
        run: go test ./... > go-test.log 2>&1 || true
      - name: Upload diagnostic bundle
        uses: actions/upload-artifact@v4
        with:
          name: billing-diagnostics
          path: |
            contracts.log
            go-test.log
          if-no-files-found: error
          retention-days: 1
