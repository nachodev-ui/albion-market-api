name: Billing format diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  gofmt-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Format Go sources
        run: |
          gofmt -w .
          git diff --binary > gofmt.patch
      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: billing-gofmt-patch
          path: gofmt.patch
          if-no-files-found: error
          retention-days: 1
