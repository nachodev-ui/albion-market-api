name: Deploy Auth0 production to Render

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-auth0-production.yml
      - internal/config/auth.go
      - internal/authn/**
      - internal/handlers/accounts.go
      - internal/server/router.go
      - render.yaml
      - scripts/validate-auth0-production.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-render-auth0-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Activate Auth0 on Render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      API_URL: https://albion-market-api.onrender.com
      FRONTEND_ORIGIN: https://albion-production-calculator.pages.dev
      MIGRATION_IMAGE: albion-market-api:auth0-production-${{ github.sha }}
      EXPECTED_AUTH_ENABLED: 'true'
      EXPECTED_AUTH_ISSUER: https://albion-production-calculator.us.auth0.com/
      EXPECTED_AUTH_AUDIENCE: https://albion-market-api

    steps:
      - name: Checkout production revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark Auth0 deployment pending
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          payload="$(jq -n \
            --arg state pending \
            --arg context 'deploy/auth0-production' \
            --arg description 'Auth0 production activation is running' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "${payload}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null

      - name: Validate Render and Auth0 contracts
        run: |
          python3 ./scripts/validate-render-config.py
          python3 ./scripts/validate-auth0-production.py

      - name: Derive immutable build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "version=$(git rev-parse --short=12 HEAD)" >> "${GITHUB_OUTPUT}"
          echo "created=$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Build exact migration image
        run: |
          docker build \
            --build-arg "VERSION=${{ steps.metadata.outputs.version }}" \
            --build-arg "REVISION=${{ steps.metadata.outputs.revision }}" \
            --build-arg "CREATED=${{ steps.metadata.outputs.created }}" \
            --tag "${MIGRATION_IMAGE}" .

      - name: Apply and validate Neon migrations
        env:
          NEON_MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
        run: |
          test -n "${NEON_MIGRATION_DATABASE_URL}"
          docker run --rm \
            --env "DATABASE_URL=${NEON_MIGRATION_DATABASE_URL}" \
            "${MIGRATION_IMAGE}" /usr/local/bin/migrate

      - name: Trigger exact revision on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_DEPLOY_HOOK_URL}"
          separator='?'
          [[ "${RENDER_DEPLOY_HOOK_URL}" == *'?'* ]] && separator='&'
          curl --fail --silent --show-error --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${{ steps.metadata.outputs.revision }}" \
            | jq -e . >/dev/null

      - name: Wait for exact Render revision
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ steps.metadata.outputs.revision }}'
          for attempt in $(seq 1 90); do
            metrics="$(curl --fail --silent --show-error --max-time 10 "${API_URL}/metrics" 2>/dev/null || true)"
            if grep -Eq "albion_market_api_build_info\\{[^}]*revision=\"${expected}\"" <<< "${metrics}"; then
              echo "Render is serving ${expected}."
              exit 0
            fi
            echo "Attempt ${attempt}/90: waiting for Render."
            sleep 10
          done
          exit 1

      - name: Verify Auth0-enabled API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "${API_URL}/healthz" | jq -e .
          curl --fail --silent --show-error "${API_URL}/readyz" | jq -e '.status == "ok"'

          status="$(curl --silent --show-error \
            --output account-response.json \
            --write-out '%{http_code}' \
            "${API_URL}/api/v1/me")"
          if [[ "${status}" != '401' ]]; then
            echo "Expected 401 from /api/v1/me, got ${status}." >&2
            cat account-response.json >&2
            exit 1
          fi
          jq -e '.error == "unauthorized"' account-response.json >/dev/null

          headers="$(mktemp)"
          preflight="$(curl --silent --show-error --output /dev/null \
            --dump-header "${headers}" --write-out '%{http_code}' \
            --request OPTIONS \
            --header "Origin: ${FRONTEND_ORIGIN}" \
            --header 'Access-Control-Request-Method: GET' \
            --header 'Access-Control-Request-Headers: authorization' \
            "${API_URL}/api/v1/me")"
          [[ "${preflight}" == '200' || "${preflight}" == '204' ]]
          tr -d '\r' < "${headers}" | grep -Fqi "Access-Control-Allow-Origin: ${FRONTEND_ORIGIN}"

      - name: Publish Auth0 deployment status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state='failure'
          description='Auth0 production activation failed'
          if [[ "${JOB_STATUS}" == 'success' ]]; then
            state='success'
            description='Auth0 production activation passed'
          fi
          payload="$(jq -n \
            --arg state "${state}" \
            --arg context 'deploy/auth0-production' \
            --arg description "${description}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "${payload}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
