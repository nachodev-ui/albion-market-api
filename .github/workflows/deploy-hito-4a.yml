name: Deploy Hito 4A

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-hito-4a.yml

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  deploy:
    name: Dispatch and observe official Render deployment
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Dispatch production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-production.yml --ref main -f confirm=DEPLOY

      - name: Wait for production workflow and publish status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 60); do
            run_id="$(gh run list \
              --workflow deploy-production.yml \
              --event workflow_dispatch \
              --commit "${GITHUB_SHA}" \
              --limit 10 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -n "${run_id}" ]]; then
              break
            fi
            echo "Attempt ${attempt}/60: official deployment is not visible yet."
            sleep 10
          done

          if [[ -z "${run_id}" ]]; then
            echo 'Official production deployment was not found.' >&2
            exit 1
          fi

          set +e
          gh run watch "${run_id}" --exit-status
          watch_result=$?
          set -e

          run_url="$(gh run view "${run_id}" --json url --jq '.url')"
          state='failure'
          description='Render production deployment failed'
          if [[ "${watch_result}" -eq 0 ]]; then
            state='success'
            description='Render production deployment passed'
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='deploy/render-production' \
            -f description="${description}" \
            -f target_url="${run_url}" \
            > /dev/null

          exit "${watch_result}"
