name: Deploy Hito 4A

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-hito-4a.yml

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  deploy:
    name: Dispatch and observe official Render deployment
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy and publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions"

          publish_status() {
            local state="$1"
            local description="$2"
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="${state}" \
              -f context='deploy/render-production' \
              -f description="${description}" \
              -f target_url="${target_url}" \
              > /dev/null
          }

          finish() {
            local result=$?
            trap - EXIT
            if [[ "${result}" -ne 0 ]]; then
              publish_status failure 'Render production deployment failed' || true
            fi
            exit "${result}"
          }
          trap finish EXIT

          publish_status pending 'Render production deployment in progress'
          gh workflow run deploy-production.yml --ref main -f confirm=DEPLOY

          run_id=''
          for attempt in $(seq 1 60); do
            run_id="$(gh run list \
              --workflow deploy-production.yml \
              --event workflow_dispatch \
              --commit "${GITHUB_SHA}" \
              --limit 10 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -n "${run_id}" ]]; then
              break
            fi
            echo "Attempt ${attempt}/60: official deployment is not visible yet."
            sleep 10
          done

          if [[ -z "${run_id}" ]]; then
            echo 'Official production deployment was not found.' >&2
            exit 1
          fi

          target_url="$(gh run view "${run_id}" --json url --jq '.url')"
          gh run watch "${run_id}" --exit-status
          publish_status success 'Render production deployment passed'
          trap - EXIT
