name: Format Black Market implementation

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/black-market-pro-analytics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/black-market-pro-analytics
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go files
        run: gofmt -w cmd/api/main.go internal/server/router.go internal/blackmarket/blackmarket.go internal/blackmarket/blackmarket_test.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd/api/main.go internal/server/router.go internal/blackmarket/blackmarket.go internal/blackmarket/blackmarket_test.go
          git commit -m "style: format Black Market implementation"
          git push origin HEAD:feat/black-market-pro-analytics
