name: Apply Albion profile implementation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/albion-player-profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/albion-player-profile
          fetch-depth: 0
      - name: Apply source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_player_profile.py
          gofmt -w cmd/api/main.go internal/playerprofile internal/handlers/playerprofile.go internal/server/router.go internal/observability/readiness.go internal/observability/readiness_test.go internal/deployment/player_profile_contract_test.go
          rm -rf payload
          rm -f scripts/apply_player_profile.py
          rm -f .github/workflows/export-source-and-probe.yml
          rm -f .github/workflows/apply-player-profile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: implement Albion player profiles'
          git push origin HEAD:feat/albion-player-profile
