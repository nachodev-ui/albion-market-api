name: Deploy billing webhook hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-billing-webhook-hotfix.yml

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  deploy:
    name: Dispatch and observe official Render deployment
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Dispatch Deploy production to Render
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"main","inputs":{"confirm":"DEPLOY"}}' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/dispatches"

      - name: Wait for official deployment result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          endpoint="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/runs?event=workflow_dispatch&per_page=10"
          run_id=''
          run_url=''
          conclusion=''

          for attempt in $(seq 1 180); do
            response="$(curl \
              --fail \
              --silent \
              --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${endpoint}")"

            run_id="$(jq -r --arg sha "${GITHUB_SHA}" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<< "${response}" | head -n1)"
            if [[ -z "${run_id}" ]]; then
              echo "Attempt ${attempt}/180: deployment for ${GITHUB_SHA} is not visible yet."
              sleep 10
              continue
            fi

            run="$(jq -c --argjson id "${run_id}" '.workflow_runs[] | select(.id == $id)' <<< "${response}")"
            status="$(jq -r '.status' <<< "${run}")"
            conclusion="$(jq -r '.conclusion // empty' <<< "${run}")"
            run_url="$(jq -r '.html_url' <<< "${run}")"
            echo "Official deployment ${run_id}: status=${status} conclusion=${conclusion:-pending}."

            if [[ "${status}" == 'completed' ]]; then
              break
            fi
            sleep 10
          done

          if [[ -z "${run_id}" || -z "${conclusion}" ]]; then
            echo 'Official deployment did not finish before the timeout.' >&2
            exit 1
          fi

          state='failure'
          description='Render production deployment failed'
          if [[ "${conclusion}" == 'success' ]]; then
            state='success'
            description='Render production deployment passed'
          fi

          payload="$(jq -n \
            --arg state "${state}" \
            --arg context 'deploy/render-production' \
            --arg description "${description}" \
            --arg target_url "${run_url}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "${payload}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            >/dev/null

          [[ "${conclusion}" == 'success' ]]
