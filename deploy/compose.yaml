name: ${COMPOSE_PROJECT_NAME:-albion-market-api}

services:
  postgres:
    image: postgres:17.10-alpine3.23@sha256:3da929dcc3e63e3f0cc81fdb114c073ca48bfc7280e83a6324d5652fbee63742
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-albion_market}
      POSTGRES_USER: ${POSTGRES_USER:-albion_market}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  migrate:
    image: postgres:17.10-alpine3.23@sha256:3da929dcc3e63e3f0cc81fdb114c073ca48bfc7280e83a6324d5652fbee63742
    restart: "no"
    user: postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-albion_market}
      POSTGRES_USER: ${POSTGRES_USER:-albion_market}
    secrets:
      - postgres_password
    volumes:
      - ../migrations:/migrations:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        migration_count=0
        for migration in $$(find /migrations -maxdepth 1 -type f -name '*.sql' | LC_ALL=C sort); do
          migration_count=$$((migration_count + 1))
          echo "Applying $${migration##*/}"
          psql \
            --host postgres \
            --username "$${POSTGRES_USER}" \
            --dbname "$${POSTGRES_DB}" \
            --set ON_ERROR_STOP=1 \
            --file "$${migration}"
        done
        test "$${migration_count}" -gt 0

  api:
    image: ${API_IMAGE:-albion-market-api:local}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${IMAGE_VERSION:-local}
        REVISION: ${IMAGE_REVISION:-unknown}
        CREATED: ${IMAGE_CREATED:-1970-01-01T00:00:00Z}
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      LOAD_DOTENV: "false"
      LOG_COLOR: never
      LOG_FORMAT: json
      DATABASE_URL_FILE: /run/secrets/database_url
      INGEST_BEARER_TOKEN_FILE: /run/secrets/ingest_token
      INGEST_BEARER_TOKEN_ID: ${INGEST_TOKEN_ID:-receiver-current}
      INGEST_REQUIRE_HTTPS: ${INGEST_REQUIRE_HTTPS:-true}
      CORS_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    secrets:
      - database_url
      - ingest_token
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700
    ports:
      - 127.0.0.1:${API_HOST_PORT:-8080}:8080
    networks:
      - frontend
      - backend
      - observability
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_signal: SIGTERM
    stop_grace_period: 15s

  prometheus:
    profiles:
      - observability
    image: prom/prometheus@sha256:a75c5a35bc21d7afe69551eefa3cb1e1fb1775fe759408007a66b54ec3de1f29
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks:
      - observability
      - observability_host
    depends_on:
      api:
        condition: service_started
      alertmanager:
        condition: service_started

  alertmanager:
    profiles:
      - observability
    image: prom/alertmanager@sha256:cc54cc450174ada901b32eb2538de5fc70ee259a1ac551ed38023f2ca2ad00e3
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    networks:
      - observability
      - observability_host

  grafana:
    profiles:
      - observability
    image: grafana/grafana:12.4.4-ubuntu@sha256:df2e7ef5f32f771794cf76bad5f2bceac227036460a2cc269a9045e5662abc58
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/albion-market-api-overview.json
      GF_LOG_MODE: console
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=472,gid=0,mode=1777
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    networks:
      - observability
      - observability_host
    depends_on:
      prometheus:
        condition: service_started

networks:
  frontend:
  backend:
    internal: true
  observability:
    internal: true
  observability_host:

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

secrets:
  postgres_password:
    file: "${POSTGRES_PASSWORD_SECRET_FILE:-../secrets/deployment/postgres-password}"
  database_url:
    file: "${DATABASE_URL_SECRET_FILE:-../secrets/deployment/database-url}"
  ingest_token:
    file: "${INGEST_TOKEN_SECRET_FILE:-../secrets/deployment/ingest-current.token}"
