          minimum: 0
        acquired_connections:
          type: integer
          format: int32
          minimum: 0
        idle_connections:
          type: integer
          format: int32
          minimum: 0
        constructing_connections:
          type: integer
          format: int32
          minimum: 0
        acquire_count:
          type: integer
          format: int64
          minimum: 0
        empty_acquire_count:
          type: integer
          format: int64
          minimum: 0
        canceled_acquire_count:
          type: integer
          format: int64
          minimum: 0
        new_connections_count:
